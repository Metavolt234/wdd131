<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>
    <form method="get" action="review.html">

        <div class="form-group">
            <label for="product">Product Name *</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>
        </div>

        <fieldset>
            <legend>Overall Rating *</legend>

            <label>
                <input type="radio" id="rating1" name="rating" value="1" required>
                ☆
            </label>

            <label>
                <input type="radio" id="rating2" name="rating" value="2">
                ☆☆
            </label>

            <label>
                <input type="radio" id="rating3" name="rating" value="3">
                ☆☆☆
            </label>

            <label>
                <input type="radio" id="rating4" name="rating" value="4">
                ☆☆☆☆
            </label>

            <label>
                <input type="radio" id="rating5" name="rating" value="5">
                ☆☆☆☆☆
            </label>
        </fieldset>

        <div class="form-group">
            <label for="installDate">Date of Installation *</label>
            <input type="date" id="installDate" name="installDate" required>
        </div>

        <fieldset>
            <legend>Useful Features</legend>

            <label>
                <input type="checkbox" id="durability" name="features" value="Durability">
                Durability
            </label>

            <label>
                <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                Ease of Use
            </label>

            <label>
                <input type="checkbox" id="performance" name="features" value="Performance">
                Performance
            </label>

            <label>
                <input type="checkbox" id="design" name="features" value="Design">
                Design
            </label>
        </fieldset>

        <div class="form-group">
            <label for="review">Written Review</label>
            <textarea id="review" name="review" rows="5"></textarea>
        </div>

        <div class="form-group">
            <label for="username">User Name</label>
            <input type="text" id="username" name="username">
        </div>

        <input type="submit" value="Submit Review">

    </form>
</main>

<footer>
    <p>&copy; 2026 | Tumwesige Nelson | WDD 131</p>
</footer>

</body>
</html>
