<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Album</title>

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <script src="scripts/temples.js" defer></script>
</head>
<body>

    <header>
        <h1>Temple Album</h1>

        <button id="menu-button">&#9776;</button>

        <nav>
            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
    </header>

    <main>
        <h2>Beautiful Temples</h2>

        <div class="gallery">

            <figure>
                <img src="https://picsum.photos/300/200?1" alt="Temple 1">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?2" alt="Temple 2">
                <figcaption>Rome Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?3" alt="Temple 3">
                <figcaption>Nairobi Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?4" alt="Temple 4">
                <figcaption>Kampala Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?5" alt="Temple 5">
                <figcaption>Accra Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?6" alt="Temple 6">
                <figcaption>Johannesburg Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?7" alt="Temple 7">
                <figcaption>Paris Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?8" alt="Temple 8">
                <figcaption>London Temple</figcaption>
            </figure>

            <figure>
                <img src="https://picsum.photos/300/200?9" alt="Temple 9">
                <figcaption>Tokyo Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Temple Album | Uganda</p>
        <p id="lastModified"></p>
    </footer>

</body>
</html>
