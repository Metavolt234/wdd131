<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Uganda - The Pearl of Africa</title>

    <meta name="description" content="A responsive webpage about Uganda.">
    <meta name="author" content="Tumwesige Nelson">

    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Uganda - The Pearl of Africa</h1>
    </header>

    <main>

        <!-- HERO SECTION -->
        <section class="hero">
            <picture>
                <source media="(min-width: 768px)"
                    srcset="images/hero.jpg">

                <img src="images/hero.jpg"
                    alt="Beautiful scenery of Uganda"
                    width="500"
                    height="250">
            </picture>
        </section>

        <!-- CONTENT SECTION -->
        <div class="info-grid">

            <!-- DATA CARD -->
            <section class="card">
                <h2>Data</h2>

                <p><strong>Country:</strong> Uganda</p>
                <p><strong>Capital:</strong> Kampala</p>
                <p><strong>Population:</strong> 48 Million+</p>
                <p><strong>Languages:</strong> English & Luganda</p>
                <p><strong>Currency:</strong> Ugandan Shilling</p>
                <p><strong>Known For:</strong> Wildlife & Nature</p>
            </section>

            <!-- WEATHER CARD -->
            <section class="card weather">

                <h2>Weather</h2>

                <!-- Mobile SVG Icon -->
                <img src="images/weather.svg"
                    alt="Weather Icon"
                    class="weather-icon"
                    width="60"
                    height="60">

                <p><strong>Temperature:</strong> <span id="temp">8</span>°C</p>

                <p><strong>Conditions:</strong> Cloudy</p>

                <p><strong>Wind Speed:</strong> <span id="wind">12</span> km/h</p>

                <p><strong>Wind Chill:</strong>
                    <span id="windchill"></span>
                </p>

            </section>

        </div>

    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span>
            🌍 Uganda Project 🌍
        </p>

        <p id="lastModified"></p>
    </footer>

</body>
</html>
